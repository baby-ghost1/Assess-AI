services:
  mongodb:
    image: mongo:7
    container_name: assessai-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: assessai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: assessai-app-dev
    ports:
      - "5000:5000"
      - "5173:5173"
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/ai-assessment-platform
      REDIS_URL: redis://redis:6379
    volumes:
      - ./server:/app/server
      - ./client/src:/app/client/src
      - ./client/public:/app/client/public
      - ./client/index.html:/app/client/index.html
      - ./shared:/app/shared
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "cd client && npx vite --host 0.0.0.0 --port 5173 & npx nodemon --legacy-watch server/src/app.js"

volumes:
  mongo-data:
  redis-data:
